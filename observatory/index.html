<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Playing AI Agents</title>
<meta name="description" content="Every game-playing AI agent in one place: what is training, what it learned, and the films that prove it.">
<style>
  :root {
    color-scheme: dark light;
    --bg: #0a0c10;
    --bg-tint: radial-gradient(1200px 600px at 20% -10%, #15203a 0%, transparent 60%),
               radial-gradient(900px 500px at 90% 0%, #1a1630 0%, transparent 55%);
    --panel: #12151c;
    --panel-2: #181c25;
    --panel-3: #1f2430;
    --ink: #eef1f7;
    --ink-dim: #949db0;
    --ink-faint: #6b7484;
    --line: #242a36;
    --accent: #6d8dff;
    --accent-2: #46d6c4;
    --ok: #3ddc97;
    --warn: #f0b45e;
    --bad: #f2715f;
    --idle: #6b7484;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
    --r: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f6fa;
      --bg-tint: radial-gradient(1200px 600px at 20% -10%, #dfe7ff 0%, transparent 60%),
                 radial-gradient(900px 500px at 90% 0%, #e8e2ff 0%, transparent 55%);
      --panel: #ffffff; --panel-2: #f3f5f9; --panel-3: #e9edf4;
      --ink: #121722; --ink-dim: #5b6575; --line: #e0e5ee;
      --accent: #3a63f0; --accent-2: #0f9c90; --ok: #12875c; --warn: #9a6512;
      --bad: #c2402f; --idle: #7b8495;
      --shadow: 0 1px 2px rgba(20,30,60,.06), 0 10px 26px rgba(20,30,60,.08);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); background-image: var(--bg-tint);
    background-attachment: fixed; color: var(--ink);
    font: 15.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 80px; }

  /* ---------- top bar ---------- */
  .top { display: flex; align-items: center; gap: 16px; padding: 26px 0 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 11px; margin-right: auto; }
  .logo { width: 34px; height: 34px; border-radius: 10px; flex: none;
          background: linear-gradient(135deg, var(--accent), var(--accent-2));
          box-shadow: 0 4px 14px rgba(109,141,255,.35); }
  .brand h1 { font-size: 19px; margin: 0; letter-spacing: -0.02em; }
  .brand .sub { font-size: 12px; color: var(--ink-dim); font-family: var(--mono); }
  .pill { background: var(--panel); border: 1px solid var(--line); color: var(--ink);
          border-radius: 999px; padding: 7px 14px; font-size: 12.5px; cursor: pointer;
          display: inline-flex; align-items: center; gap: 7px; }
  .pill:hover { border-color: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--ok); flex: none;
         box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .dot.off { background: var(--idle); box-shadow: none; }

  .machine { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .machine span { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim);
                  background: var(--panel); border: 1px solid var(--line);
                  border-radius: 999px; padding: 4px 11px; }
  .machine b { color: var(--ink); font-weight: 600; }

  /* ---------- cards ---------- */
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line);
          border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow);
          cursor: pointer; text-align: left; padding: 0; color: inherit; font: inherit;
          transition: transform .16s cubic-bezier(.2,.7,.3,1), border-color .16s, box-shadow .16s; }
  .card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
                box-shadow: 0 2px 4px rgba(0,0,0,.4), 0 16px 36px rgba(0,0,0,.35); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb { position: relative; aspect-ratio: 16/9; background: #0a0c10; display: block; width: 100%; }
  .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .none { position: absolute; inset: 0; display: grid; place-items: center;
                 color: var(--ink-dim); font-size: 12.5px; font-family: var(--mono);
                 background: linear-gradient(135deg, var(--panel-2), var(--panel-3)); }
  .thumb .veil { position: absolute; inset: auto 0 0 0; height: 54%; pointer-events: none;
                 background: linear-gradient(to top, rgba(6,8,12,.92), transparent); }
  .thumb .delta { position: absolute; left: 12px; bottom: 10px; font-family: var(--mono);
                  font-size: 12px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .card .body { padding: 13px 15px 15px; }
  .card .name { font-weight: 640; font-size: 16.5px; letter-spacing: -0.01em; display: flex;
                align-items: center; gap: 8px; justify-content: space-between; }
  .card .where { color: var(--ink-dim); font-size: 12px; font-family: var(--mono); margin-top: 2px; }
  .card .blurb { color: var(--ink-dim); font-size: 13px; margin-top: 8px;
                 display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .foot { display: flex; align-items: center; gap: 8px; margin-top: 11px; flex-wrap: wrap; }

  .chip { font-family: var(--mono); font-size: 11px; padding: 3px 9px; border-radius: 999px;
          border: 1px solid currentColor; display: inline-flex; align-items: center; gap: 6px; }
  .chip.running, .chip.starting { color: var(--accent); }
  .chip.finished { color: var(--ok); }
  .chip.stalled { color: var(--bad); }
  .chip.notstarted { color: var(--idle); }
  .chip.learned { color: var(--ok); }
  .chip.insidenoise { color: var(--warn); }
  .chip.nogain { color: var(--bad); }
  .chip.plain { color: var(--ink-dim); }
  .chip .d { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }

  .bar { height: 5px; border-radius: 99px; background: var(--panel-3); overflow: hidden; flex: 1; min-width: 60px; }
  .bar span { display: block; height: 100%; border-radius: 99px;
              background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

  /* ---------- detail ---------- */
  .back { background: none; border: 0; color: var(--ink-dim); cursor: pointer; font: inherit;
          font-size: 13.5px; padding: 0; margin-bottom: 14px; display: inline-flex; gap: 7px; }
  .back:hover { color: var(--ink); }
  .head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
  .head h2 { font-size: 28px; margin: 0; letter-spacing: -0.025em; }
  .head .where { color: var(--ink-dim); font-family: var(--mono); font-size: 12.5px; }
  .lede { color: var(--ink-dim); margin: 0 0 20px; max-width: 72ch; }

  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           margin-bottom: 20px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 13px;
          padding: 13px 15px; }
  .tile .n { font-size: 23px; font-weight: 650; font-family: var(--mono); letter-spacing: -0.03em;
             font-variant-numeric: tabular-nums; }
  .tile .k { color: var(--ink-dim); font-size: 11.5px; margin-top: 3px; letter-spacing: .03em; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
           padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .panel h3 { margin: 0 0 3px; font-size: 15.5px; letter-spacing: -0.01em; }
  .panel p.note { margin: 0 0 14px; color: var(--ink-dim); font-size: 13px; }
  .cols { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: right; padding: 8px 9px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child, .l { text-align: left; }
  th { color: var(--ink-dim); font-weight: 600; font-size: 11px; text-transform: uppercase;
       letter-spacing: .07em; }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  tr.hi td { color: var(--ok); font-weight: 640; }
  tr.lo td { color: var(--ink-dim); }

  .films { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .film { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .film video { width: 100%; display: block; background: #07090d; }
  .film .cap { padding: 8px 11px; font-size: 12px; color: var(--ink-dim); font-family: var(--mono); }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
        overflow-x: auto; font-family: var(--mono); font-size: 11.5px; line-height: 1.5;
        margin: 0; color: var(--ink-dim); }
  .k { color: var(--ink-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
       margin: 0 0 7px; }
  .empty { color: var(--ink-dim); font-size: 13.5px; }
  .actions { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin: 2px 0 18px; }
  .btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
         border-radius: 10px; padding: 9px 15px; font: inherit; font-size: 13.5px;
         cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
         transition: border-color .14s, background .14s, transform .14s; }
  .btn:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.go { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 24%, transparent),
                                        color-mix(in srgb, var(--accent-2) 18%, transparent));
            border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .btn.stop { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  .hint { color: var(--ink-dim); font-size: 12.5px; }
  .hint code { background: var(--panel-2); padding: 2px 6px; border-radius: 6px;
               font-family: var(--mono); font-size: 11.5px; }
  .cfg { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
         padding: 16px 18px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .cfg h3 { margin: 0 0 3px; font-size: 15.5px; }
  .cfg .note { color: var(--ink-dim); font-size: 13px; margin: 0 0 14px; }
  .fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .field label { display: block; color: var(--ink-dim); font-size: 11px;
                 text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 10px; font: inherit; font-size: 13.5px;
    font-family: var(--mono); }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field .range { color: var(--ink-dim); font-size: 10.5px; margin-top: 4px; font-family: var(--mono); }
  .lrcurve { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
             padding: 10px 12px; margin-top: 14px; }
  .sweep { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           align-items: end; }
  .sweep .wide { grid-column: span 2; }
  .cfg-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 26px;
           background: var(--panel); border: 1px solid var(--line); color: var(--ink);
           padding: 11px 17px; border-radius: 12px; box-shadow: var(--shadow);
           font-size: 13.5px; z-index: 40; max-width: min(620px, 92vw); }
  .toast.bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
  figure { margin: 0; }
  @media (max-width: 560px) { .head h2 { font-size: 23px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>Game Playing AI Agents</h1>
        <div class="sub" id="taken">…</div>
      </div>
    </div>
    <button class="pill" id="refresh"><span class="dot" id="dot"></span><span id="refresh-label">live</span></button>
    <button class="pill" id="theme">theme</button>
  </div>
  <div class="machine" id="machine"></div>
  <main id="main"></main>
</div>

<script src="data/snapshot.js"></script>
<script>
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c;
                          if (h !== undefined) n.innerHTML = h; return n; };
const esc = s => String(s ?? "").replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
const num = (v, d = 2) => (v === null || v === undefined || v === "") ? "—" : Number(v).toFixed(d);
const int = v => (v === null || v === undefined) ? "—" : Number(v).toLocaleString();
const BUDGET = { boxing: 2000000, platformer: 2000000, racing: 1200000, pingpong: 2000000 };
const cls = s => String(s).replace(/[^a-z]/g, "");

/* ---------- theme ---------- */
try {
  document.documentElement.setAttribute("data-theme", localStorage.getItem("obs-theme") || "dark");
} catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
$("#theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("obs-theme", next); } catch (e) {}
});

/* ---------- small charts ---------- */
function area(points, key, label, colour) {
  const pts = points.filter(p => p[key] !== null && p[key] !== undefined);
  if (pts.length < 2) return el("p", "empty", "not enough data for " + label);
  const w = 560, h = 170, pad = { l: 46, r: 10, t: 12, b: 22 };
  const xs = pts.map(p => p.steps), ys = pts.map(p => p[key]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const lo = Math.min(...ys), hi = Math.max(...ys), span = (hi - lo) || 1;
  const X = v => pad.l + (v - x0) / ((x1 - x0) || 1) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - (v - lo) / span * (h - pad.t - pad.b);
  const id = "g" + Math.random().toString(36).slice(2, 8);
  let body = `<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${colour}" stop-opacity=".34"/>
      <stop offset="100%" stop-color="${colour}" stop-opacity="0"/></linearGradient></defs>`;
  [lo, (lo + hi) / 2, hi].forEach(v => {
    body += `<line x1="${pad.l}" y1="${Y(v)}" x2="${w - pad.r}" y2="${Y(v)}" stroke="currentColor" stroke-opacity=".09"/>`
         + `<text x="${pad.l - 7}" y="${Y(v) + 3.5}" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".5">${v.toFixed(1)}</text>`;
  });
  const line = pts.map((p, i) => (i ? "L" : "M") + X(p.steps).toFixed(1) + " " + Y(p[key]).toFixed(1)).join(" ");
  body += `<path d="${line} L ${X(x1).toFixed(1)} ${h - pad.b} L ${X(x0).toFixed(1)} ${h - pad.b} Z" fill="url(#${id})"/>`;
  body += `<path d="${line}" fill="none" stroke="${colour}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  body += `<text x="${pad.l}" y="${h - 6}" font-size="10" fill="currentColor" fill-opacity=".5">${(x0 / 1e6).toFixed(2)}M</text>`
       + `<text x="${w - pad.r}" y="${h - 6}" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".5">${(x1 / 1e6).toFixed(2)}M steps</text>`;
  const f = el("figure");
  f.append(el("div", "k", label));
  f.insertAdjacentHTML("beforeend",
    `<svg viewBox="0 0 ${w} ${h}" width="100%" style="height:auto;display:block" role="img" aria-label="${esc(label)}">${body}</svg>`);
  return f;
}

function bars(rows, opts = {}) {
  const w = 560, rowH = 26, pad = { l: opts.labelWidth || 150, r: 60, t: 4, b: 4 };
  const max = opts.max || Math.max(...rows.map(r => Math.abs(r.value))) || 1;
  const h = pad.t + pad.b + rows.length * rowH;
  let body = "";
  rows.forEach((r, i) => {
    const y = pad.t + i * rowH;
    const len = Math.max(2, (w - pad.l - pad.r) * (Math.abs(r.value) / max));
    body += `<text x="${pad.l - 9}" y="${y + 16}" text-anchor="end" font-size="12" fill="currentColor" fill-opacity=".8">${esc(r.label)}</text>`
         + `<rect x="${pad.l}" y="${y + 6}" width="${len}" height="${rowH - 13}" rx="4" fill="${r.colour || "var(--accent)"}"/>`
         + `<text x="${pad.l + len + 8}" y="${y + 16}" font-size="11.5" font-family="${"ui-monospace,monospace"}" fill="currentColor" fill-opacity=".72">${esc(r.text ?? r.value)}</text>`;
  });
  const f = el("figure");
  if (opts.label) f.append(el("div", "k", opts.label));
  f.insertAdjacentHTML("beforeend",
    `<svg viewBox="0 0 ${w} ${h}" width="100%" style="height:auto;display:block" role="img" aria-label="${esc(opts.label || "bars")}">${body}</svg>`);
  return f;
}

function film(src, caption) {
  const box = el("div", "film");
  const v = document.createElement("video");
  v.src = src; v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
  v.controls = true; v.setAttribute("muted", "");
  box.append(v, el("div", "cap", esc(caption)));
  return box;
}

/* ---------- control: only when served by observatory/server.py ---------- */
const CONTROLLED = typeof window.OBS_TOKEN === "string";
let JOBS = [];

function toast(message, bad = false) {
  const t = el("div", "toast" + (bad ? " bad" : ""), esc(message));
  document.body.append(t);
  setTimeout(() => t.remove(), 5200);
}

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Obs-Token": window.OBS_TOKEN },
    body: JSON.stringify(body || {}),
  });
  return res.json();
}

async function pollJobs() {
  if (!CONTROLLED) return;
  try {
    const res = await fetch("api/jobs");
    const payload = await res.json();
    JOBS = payload.jobs || [];
    SCHEMA = payload.schema || SCHEMA;
    PRESETS = payload.presets || PRESETS;
    SWEEPABLE = payload.sweepable || SWEEPABLE;
  } catch (e) { JOBS = []; }
}

function jobFor(kind, game) {
  return JOBS.find(j => j.kind === kind && j.game === game && j.running);
}

const DEFAULTS = { steps: 1000000, envs: 12, arch: "nature", width: 1, lr: 0.00025,
                   lr_schedule: "linear", entropy: 0.01, rollout: 128, epochs: 4,
                   minibatches: 4, device: "auto", seed: 0 };
const ORDER = ["steps", "envs", "arch", "width", "lr", "lr_schedule", "entropy",
               "rollout", "epochs", "minibatches", "device", "seed"];
let SCHEMA = {};
let PRESETS = {};
let SWEEPABLE = [];
let formState = {};
let sweepState = {};

function lrCurve(state) {
  // The schedule drawn as the shape it is. A number in a box does not tell you
  // that 'linear' spends the back half of training at a rate too small to move
  // anything, or that warmup starts at zero -- the curve does.
  const n = 120, lr = Number(state.lr) || 0.00025, kind = state.lr_schedule || "linear";
  const warm = 0.05;
  const at = i => {
    const p = i / n;
    if (kind === "constant") return lr;
    if (kind === "linear") return lr * (1 - p);
    if (kind === "cosine") return lr * 0.5 * (1 + Math.cos(Math.PI * p));
    if (p < warm) return lr * (p / warm);
    return lr * 0.5 * (1 + Math.cos(Math.PI * ((p - warm) / (1 - warm))));
  };
  const w = 520, h = 86, pad = { l: 54, r: 10, t: 8, b: 16 };
  const ys = Array.from({ length: n + 1 }, (_, i) => at(i));
  const hi = Math.max(...ys) || 1;
  const X = i => pad.l + (i / n) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - (v / hi) * (h - pad.t - pad.b);
  const d = ys.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" ");
  const box = el("div", "lrcurve");
  box.append(el("div", "k", "learning rate over the run — " + esc(kind)));
  box.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 ${w} ${h}" width="100%"
    style="height:auto;display:block" role="img" aria-label="learning rate schedule">
    <line x1="${pad.l}" y1="${Y(0)}" x2="${w - pad.r}" y2="${Y(0)}" stroke="currentColor" stroke-opacity=".12"/>
    <text x="${pad.l - 7}" y="${Y(hi) + 4}" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".55">${hi.toExponential(1)}</text>
    <text x="${pad.l - 7}" y="${Y(0) + 4}" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".55">0</text>
    <path d="${d}" fill="none" stroke="var(--accent-2)" stroke-width="2"/>
    <text x="${w - pad.r}" y="${h - 3}" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".55">end of training</text>
  </svg>`);
  return box;
}

function sweepPanel(e) {
  const running = jobFor("sweep", e.key);
  const box = el("div", "cfg");
  box.append(el("h3", "", "Sweep one setting"),
    el("p", "note", running
      ? "A sweep is running: one arm at a time, each into its own directory."
      : "Train the same game once per value and score every arm on the same levels. The arms run one after another on purpose — side by side they would be measuring the contention as much as the setting."));
  const state = sweepState[e.key] = sweepState[e.key] || { param: "lr", values: "1e-4, 2.5e-4, 5e-4", steps: 300000, episodes: 5 };
  const grid = el("div", "sweep");

  const pick = el("div", "field");
  pick.append(el("label", "", "setting"));
  const sel = document.createElement("select");
  (SWEEPABLE.length ? SWEEPABLE : ["lr"]).forEach(k => {
    const o = document.createElement("option"); o.value = k; o.textContent = k;
    if (state.param === k) o.selected = true; sel.append(o);
  });
  sel.disabled = !!running;
  sel.addEventListener("change", () => { state.param = sel.value; render(); });
  pick.append(sel); grid.append(pick);

  const vals = el("div", "field wide");
  vals.append(el("label", "", "values, comma separated"));
  const input = document.createElement("input");
  input.type = "text"; input.value = state.values; input.disabled = !!running;
  input.addEventListener("change", () => { state.values = input.value; });
  vals.append(input); grid.append(vals);

  [["steps", "steps per arm"], ["episodes", "scoring episodes"]].forEach(([key, label]) => {
    const f = el("div", "field");
    f.append(el("label", "", label));
    const inp = document.createElement("input");
    inp.type = "number"; inp.value = state[key]; inp.disabled = !!running;
    inp.addEventListener("change", () => { state[key] = parseInt(inp.value, 10); });
    f.append(inp); grid.append(f);
  });
  box.append(grid);

  const foot = el("div", "cfg-foot");
  const btn = el("button", "btn " + (running ? "stop" : "go"),
    running ? "■ stop sweep" : "▶ run sweep");
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    const r = running
      ? await api("api/sweep/stop", { game: e.key })
      : await api("api/sweep/start", { game: e.key, param: state.param,
          values: String(state.values).split(",").map(v => v.trim()).filter(Boolean),
          steps: state.steps, episodes: state.episodes });
    toast(r.ok ? (running ? "sweep stopped" : `sweep queued: ${(r.arms || []).join(", ")}`) : r.error, !r.ok);
    await pollJobs(); render();
  });
  foot.append(btn);
  if (running) {
    const cfg = running.config || {};
    foot.append(el("span", "chip running",
      `<span class="d"></span>${esc(cfg.param)} over ${(cfg.values || []).length} arms · ${Math.round(running.seconds / 60)}m`));
  }
  box.append(foot);
  return box;
}

function configForm(e) {
  const running = jobFor("train", e.key);
  const box = el("div", "cfg");
  box.append(el("h3", "", running ? "Running with" : "Training settings"),
    el("p", "note", running
      ? "These are the settings this run was started with. Stop it to change them."
      : "Every value is checked against a range before anything starts, and a setting outside it is refused rather than quietly adjusted."));

  const state = formState[e.key] = formState[e.key] || { ...DEFAULTS };
  const live = running ? (running.config || {}) : null;
  const fields = el("div", "fields");
  for (const key of ORDER) {
    const rule = SCHEMA[key];
    if (!rule) continue;
    const wrap = el("div", "field");
    wrap.append(el("label", "", esc(rule.label || key)));
    let input;
    if (rule.choices) {
      input = document.createElement("select");
      rule.choices.forEach(choice => {
        const opt = document.createElement("option");
        opt.value = choice; opt.textContent = choice;
        if (String(live ? live[key] : state[key]) === choice) opt.selected = true;
        input.append(opt);
      });
    } else {
      input = document.createElement("input");
      input.type = "number";
      input.value = live ? (live[key] ?? "") : state[key];
      if (rule.min !== undefined) input.min = rule.min;
      if (rule.max !== undefined) input.max = rule.max;
      input.step = rule.kind === "float" ? "any" : "1";
    }
    input.disabled = !!running;
    input.addEventListener("change", () => {
      state[key] = rule.kind === "float" ? parseFloat(input.value) :
                   (rule.choices ? input.value : parseInt(input.value, 10));
      // Choosing a model fills in a starting point for the rest: the wider
      // trunks are slower per step and more easily destabilised early, so they
      // want a gentler rate and a warm-up. They are suggestions, and every one
      // of them stays editable.
      if (key === "arch" && PRESETS[state.arch]) {
        Object.assign(state, PRESETS[state.arch], { arch: state.arch });
        toast("filled in the usual starting point for " + state.arch);
      }
      render();
    });
    wrap.append(input);
    if (rule.min !== undefined)
      wrap.append(el("div", "range", `${rule.min} – ${rule.max}`));
    fields.append(wrap);
  }
  box.append(fields);
  box.append(lrCurve(live || state));

  const foot = el("div", "cfg-foot");
  if (!running) {
    const reset = el("button", "btn", "reset to defaults");
    reset.addEventListener("click", () => { formState[e.key] = { ...DEFAULTS }; render(); });
    foot.append(reset);
    foot.append(el("span", "hint",
      "The architecture is saved with every checkpoint, so a model trained here can always be rebuilt and replayed."));
  }
  box.append(foot);
  return box;
}

function controls(e) {
  const box = el("div", "actions");
  if (!CONTROLLED) {
    box.append(el("div", "hint",
      "Opened from a file, so there is nothing to press. Run <code>python -m observatory.server --open</code> to start and stop runs from here."));
    return box;
  }
  const isArcade = e.kind === "arcade";
  const training = jobFor("train", e.key);
  const playing = jobFor("play", e.key);

  if (isArcade) {
    const trainBtn = el("button", "btn " + (training ? "stop" : "go"),
      training ? "■ stop training" : "▶ start training");
    trainBtn.addEventListener("click", async () => {
      trainBtn.disabled = true;
      const r = await api(training ? "api/train/stop" : "api/train/start",
                          { game: e.key, config: training ? undefined : (formState[e.key] || DEFAULTS) });
      toast(r.ok ? (training ? "training stopped" : "training started — the curve will move within a minute")
                 : r.error, !r.ok);
      await pollJobs(); render();
    });
    box.append(trainBtn);
  }

  const playable = isArcade || e.key === "doom" || e.key === "brogue";
  if (playable) {
    const playBtn = el("button", "btn " + (playing ? "stop" : ""),
      playing ? "■ stop playing" : "▶ watch it play");
    playBtn.addEventListener("click", async () => {
      playBtn.disabled = true;
      const r = await api(playing ? "api/play/stop" : "api/play/start", { game: e.key });
      toast(r.ok ? (playing ? "stopped" : "a game window is opening — the agent plays it itself")
                 : r.error, !r.ok);
      await pollJobs(); render();
    });
    box.append(playBtn);
  } else {
    box.append(el("div", "hint", "This one has no live window to open."));
  }

  if (training) box.append(el("span", "chip running", `<span class="d"></span>training · ${Math.round(training.seconds / 60)}m`));
  if (playing) box.append(el("span", "chip running", `<span class="d"></span>playing · ${playing.seconds}s`));
  return box;
}

/* ---------- data helpers ---------- */
const S = () => window.SNAPSHOT || {};
function allEntries() {
  const s = S();
  return [...(s.arcade || []), ...(s.projects || [])];
}
function find(key) { return allEntries().find(e => e.key === key); }

function deltaText(e) {
  if (e.kind === "project") return `${e.headline ?? "—"} vs ${e.baseline ?? "—"}`;
  const l = e.ladder || [];
  const first = l.find(r => r.steps === 0), last = l[l.length - 1];
  if (first && last && last !== first)
    return `untrained ${num(first.return_mean, 1)}  →  trained ${num(last.return_mean, 1)}`;
  if (e.state === "running" || e.state === "starting") return `return ${num(e.return_now, 1)}`;
  return "";
}

/* ---------- overview ---------- */
function renderOverview() {
  const main = $("#main");
  main.textContent = "";
  const intro = el("p", "lede",
    "Every agent in the workshop. Each card opens only that project: what it is doing now, the films of it playing, and the numbers underneath them.");
  main.append(intro);

  const grid = el("div", "grid");
  for (const e of allEntries()) {
    const card = el("button", "card");
    card.type = "button";
    const thumb = el("div", "thumb");
    const clip = e.kind === "arcade"
      ? (e.clips || []).find(c => c === "progress.mp4")
      : ((S().analytics || {}).project_clips || []).find(c => c.includes(e.key));
    if (clip) {
      const v = document.createElement("video");
      v.src = (e.kind === "arcade" ? e.media_dir : (S().analytics || {}).media_dir) + "/" + clip;
      v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
      v.setAttribute("muted", "");
      thumb.append(v);
    } else {
      thumb.append(el("div", "none", e.state === "finished" ? "film pending" : esc(e.state || "no film")));
    }
    thumb.append(el("div", "veil"));
    const d = deltaText(e);
    if (d) thumb.append(el("div", "delta", esc(d)));
    const body = el("div", "body");
    const v = e.verdict;
    body.append(
      el("div", "name", `<span>${esc(e.title)}</span>`),
      el("div", "where", esc(e.env_id)),
      el("div", "blurb", esc(e.blurb || e.detail || "")),
    );
    const foot = el("div", "foot");
    foot.append(el("span", "chip " + cls(e.state), `<span class="d"></span>${esc(e.state)}`));
    if (v) foot.append(el("span", "chip " + cls(v.label), esc(v.label)));
    if (e.kind === "arcade" && BUDGET[e.key]) {
      const pct = Math.min(100, 100 * (e.steps || 0) / BUDGET[e.key]);
      foot.append(el("span", "bar", `<span style="width:${pct.toFixed(1)}%"></span>`));
    }
    body.append(foot);
    card.append(thumb, body);
    card.addEventListener("click", () => { location.hash = "#/" + e.key; });
    grid.append(card);
  }
  main.append(grid);
}

/* ---------- one project ---------- */
function renderProject(key) {
  const main = $("#main");
  main.textContent = "";
  const e = find(key);
  if (!e) { location.hash = ""; return; }

  const back = el("button", "back", "← all projects");
  back.addEventListener("click", () => { location.hash = ""; });
  main.append(back);

  const head = el("div", "head");
  head.append(el("h2", "", esc(e.title)), el("div", "where", esc(e.env_id)));
  const v = e.verdict;
  head.append(el("span", "chip " + cls(e.state), `<span class="d"></span>${esc(e.state)}`));
  if (v) head.append(el("span", "chip " + cls(v.label), esc(v.label)));
  main.append(head);
  main.append(el("p", "lede", esc(e.blurb || e.detail || "")));
  main.append(controls(e));
  if (e.kind === "arcade" && CONTROLLED) {
    main.append(configForm(e));
    main.append(sweepPanel(e));
  }

  if (e.kind === "arcade") renderArcadeProject(main, e);
  else renderHandBuilt(main, e);
}

function renderArcadeProject(main, e) {
  const tiles = el("div", "tiles");
  const l = e.ladder || [];
  const first = l.find(r => r.steps === 0), last = l[l.length - 1];
  const pairs = [
    [int(e.steps), "agent steps"],
    [e.sps ? e.sps + "/s" : "—", "steps per second"],
    [e.wall_minutes ? e.wall_minutes + "m" : (e.eta_minutes ? "~" + e.eta_minutes + "m left" : "—"),
     e.wall_minutes ? "wall clock" : "estimate"],
    [e.params ? int(e.params) : "—", "parameters"],
  ];
  if (first && last && last !== first) {
    pairs.push([num(first.return_mean, 1), "untrained score"]);
    pairs.push([num(last.return_mean, 1), "trained score"]);
  }
  pairs.forEach(([n, k]) => { const t = el("div", "tile"); t.append(el("div", "n", n), el("div", "k", k)); tiles.append(t); });
  main.append(tiles);

  // films
  const clips = e.clips || [];
  if (clips.length) {
    const p = el("div", "panel");
    p.append(el("h3", "", "The same level, before and after"),
      el("p", "note", "Every panel is the same seed played by a different checkpoint of the same network. The left one has never been trained."));
    const films = el("div", "films");
    const progress = clips.find(c => c === "progress.mp4");
    if (progress) films.append(film(e.media_dir + "/" + progress, "all checkpoints, side by side"));
    clips.filter(c => c.startsWith("step_")).forEach(c => {
      const tag = c.replace("step_", "").replace(".mp4", "");
      films.append(film(e.media_dir + "/" + c, tag === "000" ? "untrained" : "after " + Number(tag) + "% of training"));
    });
    p.append(films);
    main.append(p);
  }

  const cols = el("div", "cols");
  // curves
  const left = el("div", "panel");
  left.append(el("h3", "", "Training"));
  if (e.curve && e.curve.length > 1) {
    left.append(area(e.curve, "return", "episode return", "var(--accent)"));
    left.append(area(e.curve, "entropy", "policy entropy — falling means it is committing", "var(--warn)"));
  } else left.append(el("p", "empty", "no finished episodes yet"));
  if (e.log_tail && e.log_tail.length) {
    left.append(el("div", "k", "log"), el("pre", "", esc(e.log_tail.slice(-7).join("\n"))));
  }
  cols.append(left);

  // ladder
  const right = el("div", "panel");
  right.append(el("h3", "", "Score at each checkpoint"),
    el("p", "note", "Every row plays the same levels, so the climb is like for like."));
  if (l.length) {
    const t = el("table");
    t.append(el("thead", "", "<tr><th>checkpoint</th><th>steps</th><th>score</th><th>spread</th></tr>"));
    const tb = el("tbody");
    l.forEach((r, i) => {
      const label = r.tag === "random" ? "random keys" : (r.steps === 0 ? "untrained" : r.tag + "%");
      const klass = i === l.length - 1 ? "hi" : (r.tag === "random" ? "lo" : "");
      tb.append(el("tr", klass, `<td class="l">${esc(label)}</td><td class="num">${r.steps === null ? "—" : int(r.steps)}</td>
        <td class="num">${num(r.return_mean)}</td><td class="num">± ${num(r.return_std)}</td>`));
    });
    t.append(tb);
    right.append(t);
    if (e.verdict) right.append(el("p", "note", "<b>" + esc(e.verdict.label) + ".</b> " + esc(e.verdict.detail)));
  } else right.append(el("p", "empty", "scored once training finishes"));
  cols.append(right);
  main.append(cols);
}

function renderHandBuilt(main, e) {
  const A = S().analytics || {};
  const tiles = el("div", "tiles");
  [[esc(e.headline), "result"], [esc(e.baseline), "floor it beats"]].forEach(([n, k]) => {
    const t = el("div", "tile"); t.append(el("div", "n", n), el("div", "k", k)); tiles.append(t);
  });
  main.append(tiles);

  const clip = (A.project_clips || []).find(c => c.includes(e.key));
  if (clip) {
    const p = el("div", "panel");
    p.append(el("h3", "", "Playing"), el("div", "films", ""));
    p.lastChild.append(film(A.media_dir + "/" + clip, e.title));
    main.append(p);
  }

  if (e.key === "doom") {
    const p = el("div", "panel");
    p.append(el("h3", "", "Held-out maps"), el("p", "note", "30 maps the policy never trained on, same maps for every agent."));
    const rows = (A.doom || {}).rows || e.rows || [];
    p.append(bars(rows.map(r => ({ label: r.agent, value: r.return_mean ?? r.mean,
      text: num(r.return_mean ?? r.mean, 2),
      colour: String(r.agent).startsWith("ppo") ? "var(--ok)" : "var(--idle)" })), { label: "kills per episode" }));
    if ((A.doom || {}).curve && A.doom.curve.length > 1) p.append(area(A.doom.curve, "return", "training", "var(--accent)"));
    if ((A.doom || {}).kaggle) {
      const k = A.doom.kaggle;
      const t = el("table");
      t.append(el("thead", "", "<tr><th>arm on a GPU</th><th>parameters</th><th>steps/s</th><th>kills</th></tr>"));
      const tb = el("tbody");
      Object.entries(k).forEach(([name, val]) => tb.append(el("tr", name === "wide" ? "hi" : "", `
        <td class="l">${esc(name)}</td><td class="num">${int(val.params)}</td>
        <td class="num">${val.steps_per_second}</td><td class="num">${num(val.best_policy_mean)}</td>`)));
      t.append(tb);
      p.append(el("div", "k", "was the laptop-sized network a compromise?"), t);
    }
    main.append(p);
  }

  if (e.key === "crafter") {
    const p = el("div", "panel");
    const ab = ((A.crafter || {}).ab || [])[0];
    p.append(el("h3", "", "Where the score comes from"),
      el("p", "note", "Share of episodes in which each achievement fired. The zeros are the whole reason the score is 12% and not 40%."));
    if (ab && ab.success_rates) {
      p.append(bars(Object.entries(ab.success_rates).sort((a, b) => b[1] - a[1])
        .map(([k, v]) => ({ label: k, value: v, text: v.toFixed(0) + "%",
          colour: v === 0 ? "var(--bad)" : v > 60 ? "var(--ok)" : "var(--accent)" })),
        { max: 100, labelWidth: 160 }));
    }
    const perc = (A.crafter || {}).perception;
    if (perc) {
      p.append(bars(perc.tile_accuracy.map(t => ({ label: t.daylight, value: 100 * t.tile_accuracy,
        text: (100 * t.tile_accuracy).toFixed(2) + "%",
        colour: t.tile_accuracy > 0.999 ? "var(--ok)" : "var(--warn)" })),
        { max: 100, labelWidth: 160, label: "decoder accuracy by how dark it is" }));
    }
    main.append(p);
  }

  if (e.key === "brogue") {
    const p = el("div", "panel");
    p.append(el("h3", "", "Per game"), el("p", "note", "900 keystrokes per game, same seeds for both agents."));
    const eps = (A.brogue || {}).episodes || [];
    if (eps.length) {
      const t = el("table");
      t.append(el("thead", "", "<tr><th>agent</th><th>seed</th><th>descents</th><th>map named</th><th>health at end</th></tr>"));
      const tb = el("tbody");
      eps.forEach(r => tb.append(el("tr", r.agent === "explorer" ? "hi" : "lo", `
        <td class="l">${esc(r.agent)}</td><td class="num">${r.seed}</td><td class="num">${r.descents}</td>
        <td class="num">${r.coverage === null || r.coverage === undefined ? "—" : (100 * r.coverage).toFixed(1) + "%"}</td>
        <td class="num">${num(r.health, 2)}</td>`)));
      t.append(tb);
      p.append(t);
    }
    main.append(p);
  }
}

/* ---------- routing ---------- */
function render() {
  const s = S();
  if (!s.taken_at) { $("#main").append(el("p", "empty", "No snapshot yet — run python -m observatory.collect")); return; }
  $("#taken").textContent = "snapshot " + s.taken_at;
  const m = s.machine || {};
  const bits = [];
  if (m.cpu_percent !== null && m.cpu_percent !== undefined) bits.push(`cpu <b>${m.cpu_percent}%</b>`);
  if (m.python_processes) bits.push(`python <b>${m.python_processes}</b>`);
  if (m.gpu) bits.push(`gpu <b>${esc(m.gpu.name)}</b> ${esc(m.gpu.memory_used)} / ${esc(m.gpu.memory_total)} · ${esc(m.gpu.utilisation)}`);
  const mach = $("#machine");
  mach.textContent = "";
  bits.forEach(b => mach.append(el("span", "", b)));

  const key = location.hash.replace(/^#\/?/, "");
  if (key && find(key)) renderProject(key); else renderOverview();
}
window.addEventListener("hashchange", render);

/* ---------- live refresh ---------- */
let auto = true;
function reload() {
  if (!auto) return;
  pollJobs();
  const s = document.createElement("script");
  // Cache-buster, so this also works opened straight off disk where fetching a
  // local file is blocked.
  s.src = "data/snapshot.js?t=" + Date.now();
  s.onload = () => { render(); s.remove(); };
  document.body.append(s);
}
$("#refresh").addEventListener("click", () => {
  auto = !auto;
  $("#dot").className = "dot" + (auto ? "" : " off");
  $("#refresh-label").textContent = auto ? "live" : "paused";
  if (auto) reload();
});
pollJobs().then(render);
setInterval(reload, 15000);
</script>
